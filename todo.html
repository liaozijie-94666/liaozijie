<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气查询应用</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            /* 默认背景，会被 JS 动态覆盖 */
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 1s ease;
        }

        /* 毛玻璃拟态效果 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .glass-panel-dark {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 隐藏滚动条但保留滚动功能 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 下拉菜单动画 */
        .dropdown-enter { animation: fadeInDown 0.2s ease-out forwards; }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-white p-4 md:p-8 flex justify-center items-start transition-colors duration-500">

    <div class="w-full max-w-md md:max-w-2xl flex flex-col gap-6 relative z-10">
        
        <!-- 顶部搜索栏与控制区 -->
        <div class="flex gap-2 items-center">
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="搜索城市 (如: 北京, 上海)..." 
                    class="w-full glass-panel text-white placeholder-white/60 rounded-2xl px-5 py-3 outline-none focus:ring-2 focus:ring-white/50 transition-all text-sm"
                    onkeydown="if(event.key === 'Enter') searchCity()">
                <button onclick="searchCity()" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/70 hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            
            <button onclick="getLocationWeather()" title="获取当前位置" class="glass-panel p-3.5 rounded-2xl hover:bg-white/30 transition-all text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </button>

            <button onclick="toggleFavoritesMenu()" title="收藏夹" class="glass-panel p-3.5 rounded-2xl hover:bg-white/30 transition-all text-white relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            </button>
        </div>

        <!-- 收藏夹下拉菜单 -->
        <div id="favoritesMenu" class="hidden absolute top-16 right-0 w-64 glass-panel-dark rounded-2xl p-2 z-50 dropdown-enter">
            <div class="text-xs font-semibold text-white/60 px-3 py-2 uppercase tracking-wider">已收藏城市</div>
            <div id="favoritesList" class="flex flex-col max-h-60 overflow-y-auto hide-scrollbar">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="hidden flex-col items-center justify-center py-20">
            <div class="w-10 h-10 border-4 border-white/30 border-t-white rounded-full animate-spin mb-4"></div>
            <p class="text-white/80">正在获取天气数据...</p>
        </div>

        <!-- 错误提示 -->
        <div id="errorMsg" class="hidden glass-panel bg-red-500/40 border-red-400/50 rounded-2xl p-4 text-center">
            <p id="errorText" class="text-white font-medium"></p>
        </div>

        <!-- 主要内容区 -->
        <div id="weatherContent" class="hidden flex-col gap-6">
            
            <!-- 当前天气大卡片 -->
            <div class="glass-panel rounded-3xl p-8 flex flex-col items-center relative overflow-hidden">
                <!-- 背景装饰 -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/20 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-400/20 rounded-full blur-2xl"></div>
                
                <div class="flex items-center gap-2 mb-2 z-10">
                    <h1 id="cityName" class="text-3xl font-bold tracking-wide">上海市</h1>
                    <button id="favBtn" onclick="toggleFavorite()" class="text-white/60 hover:text-yellow-400 transition-colors">
                        <svg id="favIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                    </button>
                </div>
                
                <p id="weatherDesc" class="text-white/80 text-sm mb-6 z-10 flex items-center gap-2">
                    <span id="weatherIcon">☁️</span> 多云
                </p>
                
                <div class="text-8xl font-light mb-6 z-10 flex items-start">
                    <span id="currentTemp">24</span><span class="text-4xl mt-2">°</span>
                </div>
                
                <div class="flex gap-6 text-sm text-white/80 z-10">
                    <span>最高 <span id="tempMax">28°</span></span>
                    <span>最低 <span id="tempMin">20°</span></span>
                </div>
            </div>

            <!-- 逐小时预报 -->
            <div class="glass-panel rounded-3xl p-5">
                <h3 class="text-sm font-semibold text-white/80 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    每小时预报
                </h3>
                <div id="hourlyForecast" class="flex overflow-x-auto gap-6 hide-scrollbar pb-2">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 未来几天预报 -->
            <div class="glass-panel rounded-3xl p-5">
                <h3 class="text-sm font-semibold text-white/80 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    未来 7 天预报
                </h3>
                <div id="dailyForecast" class="flex flex-col gap-3">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 详细数据 -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="glass-panel rounded-2xl p-4 flex flex-col">
                    <span class="text-xs text-white/60 mb-1">体感温度</span>
                    <span id="feelsLike" class="text-xl font-semibold">26°</span>
                </div>
                <div class="glass-panel rounded-2xl p-4 flex flex-col">
                    <span class="text-xs text-white/60 mb-1">湿度</span>
                    <span id="humidity" class="text-xl font-semibold">65%</span>
                </div>
                <div class="glass-panel rounded-2xl p-4 flex flex-col">
                    <span class="text-xs text-white/60 mb-1">风速</span>
                    <span id="windSpeed" class="text-xl font-semibold">12 km/h</span>
                </div>
                <div class="glass-panel rounded-2xl p-4 flex flex-col">
                    <span class="text-xs text-white/60 mb-1">气压</span>
                    <span id="pressure" class="text-xl font-semibold">1012 hPa</span>
                </div>
                <div class="glass-panel rounded-2xl p-4 flex flex-col col-span-2 md:col-span-1">
                    <span class="text-xs text-white/60 mb-1">日出 / 日落</span>
                    <span id="sunTimes" class="text-sm font-semibold">06:12 / 18:42</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 状态变量 ---
        let currentCityData = null; // 当前显示的城市信息 { name, lat, lon }
        let favorites = JSON.parse(localStorage.getItem('weather-favorites')) || [];
        
        // WMO 天气代码映射 (Open-Meteo 标准)
        const weatherCodes = {
            0: { desc: '晴', icon: '☀️', bg: 'linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%)' },
            1: { desc: '大部晴朗', icon: '🌤️', bg: 'linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%)' },
            2: { desc: '多云', icon: '⛅', bg: 'linear-gradient(135deg, #8CA6DB 0%, #B993D6 100%)' },
            3: { desc: '阴天', icon: '☁️', bg: 'linear-gradient(135deg, #757F9A 0%, #D7DDE8 100%)' },
            45: { desc: '雾', icon: '🌫️', bg: 'linear-gradient(135deg, #B0BEC5 0%, #90A4AE 100%)' },
            48: { desc: '雾凇', icon: '🌫️', bg: 'linear-gradient(135deg, #B0BEC5 0%, #90A4AE 100%)' },
            51: { desc: '小毛毛雨', icon: '🌦️', bg: 'linear-gradient(135deg, #667db6 0%, #0082c8 100%)' },
            53: { desc: '中毛毛雨', icon: '🌦️', bg: 'linear-gradient(135deg, #667db6 0%, #0082c8 100%)' },
            55: { desc: '大毛毛雨', icon: '🌧️', bg: 'linear-gradient(135deg, #667db6 0%, #0082c8 100%)' },
            61: { desc: '小雨', icon: '🌧️', bg: 'linear-gradient(135deg, #4b6cb7 0%, #182848 100%)' },
            63: { desc: '中雨', icon: '🌧️', bg: 'linear-gradient(135deg, #4b6cb7 0%, #182848 100%)' },
            65: { desc: '大雨', icon: '🌧️', bg: 'linear-gradient(135deg, #4b6cb7 0%, #182848 100%)' },
            71: { desc: '小雪', icon: '🌨️', bg: 'linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%)' },
            73: { desc: '中雪', icon: '🌨️', bg: 'linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%)' },
            75: { desc: '大雪', icon: '❄️', bg: 'linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%)' },
            95: { desc: '雷阵雨', icon: '⛈️', bg: 'linear-gradient(135deg, #232526 0%, #414345 100%)' },
            96: { desc: '雷阵雨伴冰雹', icon: '⛈️', bg: 'linear-gradient(135deg, #232526 0%, #414345 100%)' },
            99: { desc: '强雷阵雨伴冰雹', icon: '⛈️', bg: 'linear-gradient(135deg, #232526 0%, #414345 100%)' }
        };

        // --- UI 元素 ---
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const weatherContent = document.getElementById('weatherContent');
        const favoritesMenu = document.getElementById('favoritesMenu');
        const favoritesList = document.getElementById('favoritesList');

        // 初始化
        function init() {
            renderFavorites();
            // 默认加载北京天气（如果没有定位）
            fetchWeatherByCity('北京', true);
        }

        // --- 核心数据获取 ---

        // 1. 通过城市名获取经纬度并查天气
        async function fetchWeatherByCity(cityName, isDefault = false) {
            showLoading();
            try {
                // Geocoding API 获取经纬度
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=zh`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error(`找不到城市："${cityName}"，请检查输入。`);
                }

                const { name, latitude, longitude } = geoData.results[0];
                await fetchWeatherData({ name, lat: latitude, lon: longitude });
                
            } catch (error) {
                showError(error.message);
            }
        }

        // 2. 通过经纬度查天气
        async function fetchWeatherData(location) {
            showLoading();
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,surface_pressure&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
                
                const res = await fetch(weatherUrl);
                const data = await res.json();

                currentCityData = location;
                renderWeather(data, location.name);
                hideLoading();
                
            } catch (error) {
                showError('获取天气数据失败，请检查网络。');
            }
        }

        // 搜索按钮事件
        function searchCity() {
            const city = searchInput.value.trim();
            if (city) {
                fetchWeatherByCity(city);
                searchInput.value = '';
            }
        }

        // 获取当前位置
        function getLocationWeather() {
            if (!navigator.geolocation) {
                showError('您的浏览器不支持定位功能。');
                return;
            }
            showLoading();
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    // 通过反向地理编码获取城市名（此处简单处理，直接用“我的位置”代替）
                    await fetchWeatherData({ name: '我的位置', lat: latitude, lon: longitude });
                },
                (error) => {
                    showError('无法获取位置，请检查浏览器定位权限。');
                }
            );
        }

        // --- 渲染 UI ---

        function renderWeather(data, cityName) {
            const current = data.current;
            const daily = data.daily;
            const hourly = data.hourly;
            
            // 获取天气代码信息
            const wInfo = weatherCodes[current.weather_code] || weatherCodes[0];
            
            // 动态切换背景
            document.body.style.background = wInfo.bg;

            // 1. 当前天气
            document.getElementById('cityName').innerText = cityName;
            document.getElementById('weatherDesc').innerHTML = `<span class="text-2xl mr-1">${wInfo.icon}</span> ${wInfo.desc}`;
            document.getElementById('currentTemp').innerText = Math.round(current.temperature_2m);
            document.getElementById('tempMax').innerText = Math.round(daily.temperature_2m_max[0]) + '°';
            document.getElementById('tempMin').innerText = Math.round(daily.temperature_2m_min[0]) + '°';
            
            // 详细数据
            document.getElementById('feelsLike').innerText = Math.round(current.apparent_temperature) + '°';
            document.getElementById('humidity').innerText = current.relative_humidity_2m + '%';
            document.getElementById('windSpeed').innerText = current.wind_speed_10m + ' km/h';
            document.getElementById('pressure').innerText = Math.round(current.surface_pressure) + ' hPa';
            
            // 日出日落格式化 (只取时间部分 HH:MM)
            const formatTime = (isoStr) => new Date(isoStr).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('sunTimes').innerText = `${formatTime(daily.sunrise[0])} / ${formatTime(daily.sunset[0])}`;

            // 更新收藏按钮状态
            updateFavBtn();

            // 2. 逐小时预报 (渲染接下来的 8 个小时)
            const hourlyContainer = document.getElementById('hourlyForecast');
            hourlyContainer.innerHTML = '';
            const now = new Date().getHours();
            
            for (let i = now; i < now + 8; i++) {
                if (i >= hourly.time.length) break;
                const time = new Date(hourly.time[i]);
                const temp = Math.round(hourly.temperature_2m[i]);
                const code = weatherCodes[hourly.weather_code[i]] || weatherCodes[0];
                
                hourlyContainer.innerHTML += `
                    <div class="flex flex-col items-center gap-2 min-w-[50px]">
                        <span class="text-xs text-white/70">${i === now ? '现在' : time.getHours() + '时'}</span>
                        <span class="text-2xl">${code.icon}</span>
                        <span class="font-semibold">${temp}°</span>
                    </div>
                `;
            }

            // 3. 未来 7 天预报
            const dailyContainer = document.getElementById('dailyForecast');
            dailyContainer.innerHTML = '';
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            
            for (let i = 1; i <= 6; i++) { // 跳过今天，取后 6 天
                if (i >= daily.time.length) break;
                const date = new Date(daily.time[i]);
                const dayName = weekDays[date.getDay()];
                const tempMax = Math.round(daily.temperature_2m_max[i]);
                const tempMin = Math.round(daily.temperature_2m_min[i]);
                const code = weatherCodes[daily.weather_code[i]] || weatherCodes[0];
                
                dailyContainer.innerHTML += `
                    <div class="flex items-center justify-between py-2 border-b border-white/10 last:border-0">
                        <span class="w-12 text-sm text-white/80">${dayName}</span>
                        <span class="text-xl w-10 text-center">${code.icon}</span>
                        <span class="text-sm text-white/60 flex-1 text-right">${code.desc}</span>
                        <div class="flex gap-3 w-24 justify-end text-sm">
                            <span class="text-white/60">${tempMin}°</span>
                            <span class="font-medium">${tempMax}°</span>
                        </div>
                    </div>
                `;
            }
        }

        // --- 收藏夹逻辑 ---

        function toggleFavorite() {
            if (!currentCityData) return;
            
            const index = favorites.findIndex(f => f.name === currentCityData.name);
            if (index > -1) {
                favorites.splice(index, 1); // 移除
            } else {
                favorites.push(currentCityData); // 添加
            }
            
            localStorage.setItem('weather-favorites', JSON.stringify(favorites));
            renderFavorites();
            updateFavBtn();
        }

        function updateFavBtn() {
            const icon = document.getElementById('favIcon');
            if (!currentCityData) return;
            
            const isFav = favorites.some(f => f.name === currentCityData.name);
            if (isFav) {
                icon.setAttribute('fill', '#FCD34D'); // 黄色填充
                icon.setAttribute('stroke', '#FCD34D');
            } else {
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
            }
        }

        function renderFavorites() {
            favoritesList.innerHTML = '';
            if (favorites.length === 0) {
                favoritesList.innerHTML = '<div class="text-white/50 text-sm px-3 py-2">暂无收藏</div>';
                return;
            }
            
            favorites.forEach(fav => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center px-3 py-2 hover:bg-white/10 rounded-lg cursor-pointer transition-colors group";
                div.onclick = () => {
                    fetchWeatherData(fav);
                    toggleFavoritesMenu(); // 关闭菜单
                };
                
                div.innerHTML = `
                    <span class="text-sm">${fav.name}</span>
                    <button onclick="removeFav(event, '${fav.name}')" class="opacity-0 group-hover:opacity-100 text-white/50 hover:text-red-400 p-1 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                    </button>
                `;
                favoritesList.appendChild(div);
            });
        }

        function removeFav(e, name) {
            e.stopPropagation(); // 阻止触发跳转
            favorites = favorites.filter(f => f.name !== name);
            localStorage.setItem('weather-favorites', JSON.stringify(favorites));
            renderFavorites();
            updateFavBtn();
        }

        function toggleFavoritesMenu() {
            favoritesMenu.classList.toggle('hidden');
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', (e) => {
            if (!favoritesMenu.contains(e.target) && !e.target.closest('button[title="收藏夹"]')) {
                favoritesMenu.classList.add('hidden');
            }
        });

        // --- 状态控制辅助函数 ---

        function showLoading() {
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            errorMsg.classList.add('hidden');
            weatherContent.classList.add('hidden');
            weatherContent.classList.remove('flex');
        }

        function hideLoading() {
            loading.classList.add('hidden');
            loading.classList.remove('flex');
            errorMsg.classList.add('hidden');
            weatherContent.classList.remove('hidden');
            weatherContent.classList.add('flex');
        }

        function showError(msg) {
            loading.classList.add('hidden');
            loading.classList.remove('flex');
            weatherContent.classList.add('hidden');
            weatherContent.classList.remove('flex');
            
            errorMsg.classList.remove('hidden');
            errorText.innerText = msg;
        }

        // 启动应用
        init();
    </script>
</body>
</html>
